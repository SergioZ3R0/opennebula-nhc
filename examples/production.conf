# Example production configuration for opennebula-nhc.
#
# Copy to /etc/one-nhc/one-nhc.conf on the frontend (controller) and on the
# hypervisors (probe). Keep only the checks that apply to each host.
#
# This example assumes two OpenNebula clusters:
#   default: cpu + gpu nodes
#   LLM:     fat nodes
# Replace the hostlists with your real names before enabling `act`.

proc_mounts: /proc/mounts
# Set node_name only when the OpenNebula host name differs from the OS hostname.
# node_name: node001
report_not_targeted: true
cache_file: /var/lib/one-nhc/cache.json

# Groups are flattened to cluster/role and used as @default/gpu, @LLM/fat, ...
groups:
  default:
    cpu: "node[01-10]"
    gpu: "gpunv0[01,02],gpuamd0[01-10]"
  LLM:
    fat: "fat0[01-10]"

checks:
  fs-ro:
    enabled: true
    hosts: all
    allowlist: [/snap, /var/lib/snapd/snap]

  datastore-mounts:
    enabled: true
    hosts: all
    mounts:
      - {path: /var/lib/one/datastores, must_be_mount: false}
      # - {path: /shared/scratch, must_be_mount: true, writable: true}

  libvirt:
    enabled: true
    hosts: all
    uri: qemu:///system
    timeout: 6

  fs-usage:
    enabled: true
    hosts: all
    warn: 90
    crit: 95
    inode_warn: 90
    inode_crit: 95
    mounts:
      - {path: /}
      - {path: /var/lib/one}

  network-interface:
    enabled: true
    hosts: all
    interfaces:
      - {name: onebr0, state: up}

  infiniband:
    enabled: true
    hosts: "@default/gpu"
    require_openibd: true
    devices:
      - {device: mlx5_0, port: 1, state: ACTIVE, rate: 400, firmware: "28.45.1200"}

  service:
    enabled: true
    hosts: all
    services:
      - {name: openibd, type: systemd}
      - {name: slurmd, type: process}

  raid:
    enabled: true
    hosts: "@default/cpu"
    sysfs: /sys/block
    mdstat: /proc/mdstat

  smart:
    enabled: true
    hosts: all
    required: false
    sudo: true
    devices:
      - /dev/sda
      - /dev/nvme0n1

  gpu:
    enabled: true
    hosts: "@default/gpu"
    count: 4
    count_mig: true
    required: true

  gpu-fabric:
    enabled: true
    hosts: "@default/gpu"
    required: false

  # If the hosts in @default/gpu use PCI passthrough (vfio-pci), disable the
  # gpu/gpu-fabric checks above and enable pci instead. nvidia-smi is not
  # available on the host when the GPU is passed through to a VM.
  # pci:
  #   enabled: true
  #   hosts: "@default/gpu"
  #   devices:
  #     - {name: "RTX A4000", vendor: "10de", device: "24b0", driver: "vfio-pci", iommu: true}
  #     - {name: "RTX A4000 audio", vendor: "10de", device: "228b", driver: "vfio-pci", iommu: true}

  ofed-version:
    enabled: true
    hosts: "@default/gpu"
    package: mlnx-ofa_kernel
    version: "26.01"
    manager: rpm

controller:
  # Start in monitor. Move to notify, then act + dry_run, then act.
  mode: monitor
  dry_run: false

  notify_on_warn: true
  consecutive_crit: 3
  consecutive_ok: 2
  cooldown: 300
  reenable_after: 1800
  monitor_grace: 900

  never_disable_last: true
  min_healthy_hosts: 2
  # Count healthy hosts per OpenNebula cluster so a shared failure cannot empty
  # one cluster while another still has healthy hosts.
  min_healthy_hosts_scope: cluster

  # Keep the blast radius small. Add only approved hosts or groups.
  include_hosts: "@default/cpu,@default/gpu,@LLM/fat"
  # Never include clusters 1 and 15 until they are explicitly approved.
  # exclude_hosts: "legacy[01-10]"

  interval: 60
  state_file: /var/lib/one-nhc/state.json

  # Notifications are sent in notify and act modes.
  notify:
    # Local script (optional).
    # command: /usr/local/bin/nhc-alert

    # JSON webhook (optional). Retries transient failures and spaces requests
    # within a controller run.
    # webhook: https://hooks.example.com/services/XXX
    # webhook_retries: 2
    # webhook_retry_delay: 1
    # webhook_min_interval: 0.2

    # Email (optional). Never put the SMTP password in this file.
    # email:
    #   to: ops@example.com
    #   from: one-nhc@example.com
    #   host: smtp.example.com
    #   port: 587
    #   user: one-nhc@example.com
    #   password_file: /etc/one-nhc/smtp.password
    #   tls: starttls
    #   group_by: tags
    #   failures_first: true

  # Post-action hooks. Leave disabled until evacuation is validated.
  # hooks:
  #   timeout: 10
  #   on_disable: /usr/local/bin/one-nhc-on-disable
  #   on_enable: /usr/local/bin/one-nhc-on-enable
  #   on_reenable: /usr/local/bin/one-nhc-on-reenable
