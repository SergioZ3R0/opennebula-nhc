#
# one-nhc configuration.
---
proc_mounts: /proc/mounts

# Heavy checks (smart, gpu) are read from this cache by the probe. The
# one-nhc-cache.timer writes it on each host with `one-nhc cache`.
# cache_file: /var/lib/one-nhc/cache.json

# By default, checks that are not targeted are not reported. Set to true to
# emit NHC_<ID>="SKIP" (with "not targeted") and clear stale values.
# report_not_targeted: false

# Optional: override the node name used for targeting. Defaults to the short
# hostname, or the ONE_NHC_NODE environment variable when set.
# node_name: node01

# Named host groups (clush/dsh-style hostlists). Reference them with @name.
groups:
  compute: "node[01-10]"
  gpu: "gpu[01-02]"
  storage: "stor[01,03]"

# ---------------------------------------------------------------------------
# Controller (frontend only). It reads NHC_STATUS from the host monitoring
# information and decides whether to quarantine a host.
#
#   monitor: evaluate and log only (safe default)
#   notify:  evaluate, log and notify (command and/or webhook)
#   act:     evaluate, log, notify and run onehost disable/enable
#
# Actions are only applied in `act` mode and never when `dry_run` is true.
# ---------------------------------------------------------------------------
controller:
  mode: monitor
  dry_run: false

  # Hysteresis: N consecutive CRIT samples to disable, M consecutive OK
  # samples to re-enable. A new sample is a new NHC_TIMESTAMP from the probe,
  # so running the controller more often does not speed up the counter.
  consecutive_crit: 3
  consecutive_ok: 2

  # Minimum seconds between two actions on the same host.
  cooldown: 300

  # A disabled host is not monitored, so its status becomes stale. Set
  # `reenable_after` to try enabling it again after that many seconds (0
  # disables the trial and requires a manual onehost enable). After enabling,
  # CRIT values are ignored for `monitor_grace` seconds to let the probe
  # report fresh data.
  reenable_after: 0
  monitor_grace: 900

  # Refuse to disable when fewer than this many healthy monitored hosts would
  # remain. `never_disable_last: false` disables the safeguard entirely.
  never_disable_last: true
  min_healthy_hosts: 1

  # Hosts managed by the controller (clush/dsh-style hostlists, same syntax
  # as the checks). Hosts outside this selection are never touched.
  include_hosts: all
  # exclude_hosts: "stor[01-02]"

  # Seconds between iterations with `one-nhc controller --watch`.
  interval: 60

  state_file: /var/lib/one-nhc/state.json

  # Post-action hooks: run only when an action is applied in `act` mode, never
  # in `monitor`, `notify` or `dry_run`. The command receives NHC_MESSAGE,
  # NHC_HOST, NHC_HOST_ID, NHC_STATUS, NHC_ACTION, NHC_APPLIED, NHC_TIME and
  # NHC_SAMPLE. A command can be a string or a list of commands.
  # hooks:
  #   timeout: 10
  #   on_disable: /usr/local/bin/one-nhc-on-disable
  #   on_enable: /usr/local/bin/one-nhc-on-enable
  #   on_reenable: /usr/local/bin/one-nhc-on-reenable
  #
  # Evacuation is an external hook, not built into one-nhc. See
  # examples/hooks/on-disable.sh: it is a dry-run template by default.

  # Notifications are sent in `notify` and `act` modes.
  notify:
    # The command receives NHC_MESSAGE, NHC_HOST, NHC_HOST_ID, NHC_STATUS,
    # NHC_ACTION and NHC_APPLIED in its environment.
    # command: /usr/local/bin/nhc-alert

    # A JSON POST with the same fields.
    # webhook: https://hooks.example.com/services/XXX

    # Email notifications with an HTML summary and the failed checks.
    # Never put the SMTP password in this file: use password_file or
    # password_env (for example, a systemd EnvironmentFile).
    # email:
    #   to: ops@example.com
    #   from: one-nhc@example.com
    #   host: smtp.example.com
    #   port: 587
    #   user: one-nhc@example.com
    #   password_file: /etc/one-nhc/smtp.password
    #   tls: starttls
    #   group_by: none        # none | tags (Compute/Storage/Network/...)
    #   failures_first: true  # CRIT/WARN/UNKNOWN before OK

    # Local MTA (sendmail/postfix/msmtp): no SMTP user or password needed.
    # The MTA handles relay/authentication, like Icinga/Nagios do.
    # email:
    #   transport: sendmail
    #   to: ops@example.com
    #   from: one-nhc@example.com
    #   sendmail_path: /usr/sbin/sendmail
    #   sendmail_args: ["-t", "-i"]

checks:
  fs-ro:
    enabled: true
    hosts: all
    # Paths that are read-only by design (pseudo filesystems are always
    # ignored). Add your own snap/ostree/immutable paths here.
    allowlist:
      - /snap
      - /var/lib/snapd/snap

  datastore-mounts:
    enabled: true
    hosts: all
    mounts:
      - path: /var/lib/one/datastores
        must_be_mount: false
      # Example: a dedicated NFS mount per system datastore.
      # - path: /var/lib/one/datastores/0
      #   must_be_mount: true

  libvirt:
    enabled: true
    hosts: all
    uri: qemu:///system
    timeout: 6

  # --- Optional host/HPC checks (disabled by default) ----------------------
  # Uncomment and tune for your nodes.

  # Filesystem capacity and inode usage (timeout-protected df).
  # fs-usage:
  #   enabled: true
  #   hosts: all
  #   warn: 90
  #   crit: 95
  #   check_inodes: true
  #   mounts:
  #     - path: /var/lib/one/datastores
  #     - path: /shared/scratch

  # Network interface link state and speed.
  # network-interface:
  #   enabled: true
  #   hosts: all
  #   interfaces:
  #     - {name: onebr0, state: up}
  #     - {name: bond0, state: up, speed: 25000}

  # InfiniBand ports: state, minimum rate and firmware.
  # infiniband:
  #   enabled: true
  #   hosts: "@gpu"
  #   require_openibd: true
  #   devices:
  #     - {device: mlx5_0, port: 1, state: ACTIVE, rate: 400, firmware: "28.45.1200"}
  #     - {device: mlx5_bond_0, port: 1, state: ACTIVE, rate: 25}

  # systemd units or processes.
  # service:
  #   enabled: true
  #   hosts: all
  #   services:
  #     - {name: openibd, type: systemd}
  #     - {name: slurmd, type: process}

  # Linux software RAID (md).
  # raid:
  #   enabled: true
  #   hosts: all

  # SMART health of configured disks. Heavy check: the probe reads the cache.
  # smartctl often needs root; run the cache timer with the right permissions
  # or report SKIP/UNKNOWN instead of CRIT.
  # smart:
  #   enabled: true
  #   hosts: all
  #   required: false
  #   timeout: 15
  #   sudo: false       # set true with a sudoers rule for smartctl
  #   devices:
  #     - /dev/sda
  #     - /dev/nvme0n1

  # NVIDIA GPU count: fast, runs on every probe cycle. A missing GPU is
  # detected in the next sample.
  # gpu:
  #   enabled: true
  #   hosts: "@gpu"
  #   count: 4
  #   required: true

  # GPU Fabric State/Status: heavy, cached by one-nhc-cache.timer.
  # gpu-fabric:
  #   enabled: true
  #   hosts: "@gpu"
  #   required: false
  #   timeout: 10

  # MLNX OFED version (Network group).
  # ofed-version:
  #   enabled: true
  #   hosts: all
  #   package: mlnx-ofa_kernel
  #   version: "26.01"
  #   manager: rpm          # auto | rpm | dpkg

  # Generic package version check (Packages group), for other packages.
  # package-version:
  #   enabled: true
  #   hosts: all
  #   packages:
  #     - {name: some-package, version: "1.2.3", manager: rpm}
